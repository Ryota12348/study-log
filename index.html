<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>おべんきょう - シンプルな勉強記録</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans JP', sans-serif;
      background-color: #F8FAFC;
      color: #334155;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- アイコンコンポーネント (線画SVG) ---
    const Icons = {
      BookOpen: () => (
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
        </svg>
      ),
      Home: () => (
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
      ),
      PenTool: () => (
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="m12 19 7-7 3 3-7 7-3-3z"></path>
          <path d="m18 13-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path>
          <path d="m2 2 7.586 7.586"></path>
          <circle cx="11" cy="11" r="2"></circle>
        </svg>
      ),
      BookCheck: () => (
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"></path>
          <path d="m9 10 2 2 4-4"></path>
        </svg>
      ),
      BarChart2: () => (
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <line x1="18" y1="20" x2="18" y2="10"></line>
          <line x1="12" y1="20" x2="12" y2="4"></line>
          <line x1="6" y1="20" x2="6" y2="14"></line>
        </svg>
      ),
      Plus: () => (
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      ),
      Play: () => (
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
      ),
      Pause: () => (
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <rect x="6" y="4" width="4" height="16"></rect>
          <rect x="14" y="4" width="4" height="16"></rect>
        </svg>
      ),
      RotateCcw: () => (
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="1 4 1 10 7 10"></polyline>
          <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
        </svg>
      ),
      Trash2: () => (
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
      )
    };

    // --- 科目データ & カラーパレット定義 ---
    const SUBJECTS = [
      { id: 'english', name: '英語', bg: 'bg-blue-50', text: 'text-blue-600', border: 'border-blue-100', badgeBg: '#EFF6FF', badgeColor: '#2563EB' },
      { id: 'math', name: '数学', bg: 'bg-emerald-50', text: 'text-emerald-600', border: 'border-emerald-100', badgeBg: '#ECFDF5', badgeColor: '#059669' },
      { id: 'japanese', name: '国語', bg: 'bg-amber-50', text: 'text-amber-600', border: 'border-amber-100', badgeBg: '#FEF3C7', badgeColor: '#D97706' },
      { id: 'science', name: '理科', bg: 'bg-sky-50', text: 'text-sky-600', border: 'border-sky-100', badgeBg: '#F0F9FF', badgeColor: '#0284C7' },
      { id: 'social', name: '社会', bg: 'bg-orange-50', text: 'text-orange-600', border: 'border-orange-100', badgeBg: '#FFF7ED', badgeColor: '#EA580C' },
      { id: 'other', name: 'その他', bg: 'bg-slate-100', text: 'text-slate-600', border: 'border-slate-200', badgeBg: '#F1F5F9', badgeColor: '#475569' }
    ];

    // 今日の日付を取得 (YYYY-MM-DD)
    const getTodayString = () => {
      const today = new Date();
      return today.toISOString().split('T')[0];
    };

    // 日付フォーマット
    const formatDate = (dateStr) => {
      const [year, month, day] = dateStr.split('-');
      return `${parseInt(month)}月${parseInt(day)}日`;
    };

    // --- メインアプリコンポーネント ---
    function App() {
      const [activeTab, setActiveTab] = useState('home');
      
      // State & localStorage 永続化 (初期データは空の配列)
      const [records, setRecords] = useState(() => {
        const saved = localStorage.getItem('obenkyou_records');
        return saved ? JSON.parse(saved) : [];
      });

      const [workbooks, setWorkbooks] = useState(() => {
        const saved = localStorage.getItem('obenkyou_workbooks');
        return saved ? JSON.parse(saved) : [];
      });

      const [targetHours, setTargetHours] = useState(() => {
        const saved = localStorage.getItem('obenkyou_target_hours');
        return saved ? Number(saved) : 6;
      });

      useEffect(() => {
        localStorage.setItem('obenkyou_records', JSON.stringify(records));
      }, [records]);

      useEffect(() => {
        localStorage.setItem('obenkyou_workbooks', JSON.stringify(workbooks));
      }, [workbooks]);

      useEffect(() => {
        localStorage.setItem('obenkyou_target_hours', targetHours.toString());
      }, [targetHours]);

      // 全データクリア（リセット用機能）
      const handleResetAllData = () => {
        if (window.confirm('すべての学習記録とワークを削除して初期化しますか？')) {
          setRecords([]);
          setWorkbooks([]);
          localStorage.removeItem('obenkyou_records');
          localStorage.removeItem('obenkyou_workbooks');
        }
      };

      // 記録の追加
      const handleAddRecord = (newRecord) => {
        setRecords([newRecord, ...records]);
      };

      // 記録の削除
      const handleDeleteRecord = (id) => {
        setRecords(records.filter(r => r.id !== id));
      };

      // ワークの追加
      const handleAddWorkbook = (newWorkbook) => {
        setWorkbooks([...workbooks, newWorkbook]);
      };

      // ワークのページ更新
      const handleUpdateWorkbookPage = (id, newPage) => {
        setWorkbooks(workbooks.map(w => {
          if (w.id === id) {
            const validPage = Math.min(Math.max(0, newPage), w.totalPages);
            return {
              ...w,
              currentPage: validPage,
              isCompleted: validPage >= w.totalPages
            };
          }
          return w;
        }));
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 text-slate-800 pb-20 md:pb-6">
          {/* ヘッダー / ロゴ */}
          <header className="bg-white border-b border-slate-100 sticky top-0 z-10 shadow-sm">
            <div className="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
              <div className="flex items-center space-x-2">
                <div className="w-9 h-9 rounded-xl bg-blue-50 border border-blue-100 flex items-center justify-center text-blue-600">
                  <Icons.BookOpen />
                </div>
                <div>
                  <h1 className="text-lg font-bold tracking-wide text-slate-800">おべんきょう</h1>
                  <p className="text-[10px] text-slate-400 font-medium -mt-1">勉強を、シンプルに記録する。</p>
                </div>
              </div>

              {/* PC用ナビゲーション */}
              <div className="flex items-center space-x-3">
                <nav className="hidden md:flex items-center space-x-1">
                  {[
                    { id: 'home', label: 'ホーム', icon: Icons.Home },
                    { id: 'record', label: '勉強記録', icon: Icons.PenTool },
                    { id: 'workbook', label: 'ワーク管理', icon: Icons.BookCheck },
                    { id: 'analytics', label: 'データ', icon: Icons.BarChart2 },
                  ].map((item) => {
                    const Icon = item.icon;
                    const isActive = activeTab === item.id;
                    return (
                      <button
                        key={item.id}
                        onClick={() => setActiveTab(item.id)}
                        className={`flex items-center space-x-2 px-4 py-2 rounded-xl text-sm font-medium transition-all ${
                          isActive
                            ? 'bg-blue-50 text-blue-600 border border-blue-100'
                            : 'text-slate-500 hover:text-slate-800 hover:bg-slate-100'
                        }`}
                      >
                        <Icon />
                        <span>{item.label}</span>
                      </button>
                    );
                  })}
                </nav>

                {(records.length > 0 || workbooks.length > 0) && (
                  <button
                    onClick={handleResetAllData}
                    className="text-xs text-slate-400 hover:text-rose-500 font-medium px-2 py-1 transition"
                    title="データを全削除して初期化"
                  >
                    リセット
                  </button>
                )}
              </div>
            </div>
          </header>

          {/* メインコンテンツ */}
          <main className="max-w-4xl mx-auto px-4 py-6 flex-1 w-full">
            {activeTab === 'home' && (
              <HomeView
                records={records}
                targetHours={targetHours}
                setTargetHours={setTargetHours}
                onNavigateRecord={() => setActiveTab('record')}
              />
            )}
            {activeTab === 'record' && (
              <RecordView
                records={records}
                onAddRecord={handleAddRecord}
                onDeleteRecord={handleDeleteRecord}
              />
            )}
            {activeTab === 'workbook' && (
              <WorkbookView
                workbooks={workbooks}
                onAddWorkbook={handleAddWorkbook}
                onUpdatePage={handleUpdateWorkbookPage}
              />
            )}
            {activeTab === 'analytics' && (
              <AnalyticsView records={records} />
            )}
          </main>

          {/* スマホ用ボトムナビゲーション */}
          <nav className="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-100 z-20 px-2 py-1 shadow-lg">
            <div className="flex justify-around items-center">
              {[
                { id: 'home', label: 'ホーム', icon: Icons.Home },
                { id: 'record', label: '記録', icon: Icons.PenTool },
                { id: 'workbook', label: 'ワーク', icon: Icons.BookCheck },
                { id: 'analytics', label: 'データ', icon: Icons.BarChart2 },
              ].map((item) => {
                const Icon = item.icon;
                const isActive = activeTab === item.id;
                return (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`flex flex-col items-center py-2 px-3 rounded-xl transition-all ${
                      isActive ? 'text-blue-600' : 'text-slate-400'
                    }`}
                  >
                    <Icon />
                    <span className="text-[11px] font-medium mt-1">{item.label}</span>
                  </button>
                );
              })}
            </div>
          </nav>
        </div>
      );
    }

    // ==========================================
    // 1. ホーム画面 (HomeView)
    // ==========================================
    function HomeView({ records, targetHours, setTargetHours, onNavigateRecord }) {
      const todayStr = getTodayString();
      const todayRecords = records.filter(r => r.date === todayStr);
      
      const todayTotalMinutes = todayRecords.reduce((acc, r) => acc + r.durationMinutes, 0);
      const todayHours = (todayTotalMinutes / 60).toFixed(1);
      const targetMinutes = targetHours * 60;
      const progressPercent = Math.min(100, Math.round((todayTotalMinutes / targetMinutes) * 100));

      const subjectTotals = SUBJECTS.map(sub => {
        const minutes = todayRecords
          .filter(r => r.subject === sub.id)
          .reduce((acc, r) => acc + r.durationMinutes, 0);
        return { ...sub, minutes };
      }).filter(s => s.minutes > 0);

      const past7Days = Array.from({ length: 7 }, (_, i) => {
        const d = new Date();
        d.setDate(d.getDate() - (6 - i));
        const dateStr = d.toISOString().split('T')[0];
        const dayLabel = `${d.getMonth() + 1}/${d.getDate()}`;
        const totalMin = records
          .filter(r => r.date === dateStr)
          .reduce((acc, r) => acc + r.durationMinutes, 0);
        return { dateStr, dayLabel, hours: (totalMin / 60).toFixed(1) };
      });

      const maxPastHours = Math.max(...past7Days.map(d => parseFloat(d.hours)), targetHours, 1);

      return (
        <div className="space-y-6">
          {/* メイン概要カード */}
          <div className="bg-white border border-slate-100 rounded-2xl p-6 shadow-sm relative overflow-hidden">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div>
                <span className="text-xs font-semibold px-2.5 py-1 rounded-full bg-blue-50 text-blue-600 border border-blue-100">
                  TODAY • {formatDate(todayStr)}
                </span>
                <div className="mt-3 flex items-baseline space-x-2">
                  <span className="text-4xl font-extrabold text-slate-800 tracking-tight">{todayHours}</span>
                  <span className="text-lg font-medium text-slate-500">時間</span>
                  <span className="text-sm text-slate-400 font-normal">/ 目標 {targetHours}時間</span>
                </div>
              </div>

              <button
                onClick={onNavigateRecord}
                className="flex items-center justify-center space-x-2 bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-3 rounded-xl transition shadow-sm"
              >
                <Icons.Plus />
                <span>勉強を記録する</span>
              </button>
            </div>

            <div className="mt-5 space-y-2">
              <div className="flex justify-between text-xs text-slate-500 font-medium">
                <span>今日の達成度</span>
                <span>{progressPercent}%</span>
              </div>
              <div className="w-full h-3 bg-slate-100 rounded-full overflow-hidden">
                <div
                  className="h-full bg-blue-500 transition-all duration-500 rounded-full"
                  style={{ width: `${progressPercent}%` }}
                ></div>
              </div>
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            {/* 今日の科目別勉強時間 */}
            <div className="bg-white border border-slate-100 rounded-2xl p-5 shadow-sm">
              <h2 className="text-sm font-bold text-slate-700 mb-4 flex items-center justify-between">
                <span>今日の科目内訳</span>
                <span className="text-xs font-normal text-slate-400">{todayRecords.length}件の記録</span>
              </h2>

              {subjectTotals.length === 0 ? (
                <div className="text-center py-8 text-slate-400 text-sm">
                  まだ今日の勉強記録がありません。<br />学習を始めて記録しましょう！
                </div>
              ) : (
                <div className="space-y-3">
                  {subjectTotals.map(sub => {
                    const hrs = (sub.minutes / 60).toFixed(1);
                    return (
                      <div key={sub.id} className="flex items-center justify-between p-3 rounded-xl border border-slate-50 bg-slate-50/50">
                        <div className="flex items-center space-x-3">
                          <span className={`w-3 h-3 rounded-full ${sub.bg} border ${sub.border}`}></span>
                          <span className="text-sm font-semibold text-slate-700">{sub.name}</span>
                        </div>
                        <span className="text-sm font-bold text-slate-800">{sub.minutes} 分 <span className="text-xs font-normal text-slate-400">({hrs}h)</span></span>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>

            {/* 直近7日間の学習推移 */}
            <div className="bg-white border border-slate-100 rounded-2xl p-5 shadow-sm flex flex-col justify-between">
              <h2 className="text-sm font-bold text-slate-700 mb-4">直近7日間の学習推移</h2>
              <div className="flex items-end justify-between h-36 pt-4 px-2">
                {past7Days.map((day, idx) => {
                  const heightPercent = Math.min(100, (parseFloat(day.hours) / maxPastHours) * 100);
                  const isToday = day.dateStr === todayStr;
                  return (
                    <div key={idx} className="flex flex-col items-center flex-1 space-y-2">
                      <span className="text-[10px] text-slate-400 font-medium">{day.hours}h</span>
                      <div className="w-full max-w-[28px] bg-slate-100 h-24 rounded-t-lg flex items-end overflow-hidden">
                        <div
                          className={`w-full rounded-t-lg transition-all duration-300 ${
                            isToday ? 'bg-blue-500' : 'bg-emerald-400/80'
                          }`}
                          style={{ height: `${heightPercent}%` }}
                        ></div>
                      </div>
                      <span className={`text-[11px] font-medium ${isToday ? 'text-blue-600 font-bold' : 'text-slate-400'}`}>
                        {day.dayLabel}
                      </span>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>

          {/* 今日の記録一覧 */}
          <div className="bg-white border border-slate-100 rounded-2xl p-5 shadow-sm">
            <h2 className="text-sm font-bold text-slate-700 mb-4">今日の学習履歴</h2>
            {todayRecords.length === 0 ? (
              <p className="text-xs text-slate-400 text-center py-4">まだ記録がありません</p>
            ) : (
              <div className="divide-y divide-slate-100">
                {todayRecords.map((r) => {
                  const subObj = SUBJECTS.find(s => s.id === r.subject) || SUBJECTS[5];
                  return (
                    <div key={r.id} className="py-3 flex items-start justify-between">
                      <div className="space-y-1">
                        <div className="flex items-center space-x-2">
                          <span className={`text-[11px] font-bold px-2 py-0.5 rounded-md ${subObj.bg} ${subObj.text} border ${subObj.border}`}>
                            {subObj.name}
                          </span>
                          <span className="text-sm font-bold text-slate-800">{r.title}</span>
                        </div>
                        {r.memo && <p className="text-xs text-slate-500 pl-1">{r.memo}</p>}
                      </div>
                      <span className="text-xs font-bold text-slate-600 bg-slate-100 px-2.5 py-1 rounded-lg">
                        {r.durationMinutes} 分
                      </span>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      );
    }

    // ==========================================
    // 2. 勉強記録画面 (RecordView)
    // ==========================================
    function RecordView({ records, onAddRecord, onDeleteRecord }) {
      const [inputMode, setInputMode] = useState('manual');
      const [selectedSubject, setSelectedSubject] = useState('english');
      const [durationMinutes, setDurationMinutes] = useState(60);
      const [title, setTitle] = useState('');
      const [memo, setMemo] = useState('');

      const [isTimerRunning, setIsTimerRunning] = useState(false);
      const [timerSeconds, setTimerSeconds] = useState(0);
      const timerRef = useRef(null);

      useEffect(() => {
        if (isTimerRunning) {
          timerRef.current = setInterval(() => {
            setTimerSeconds(prev => prev + 1);
          }, 1000);
        } else {
          clearInterval(timerRef.current);
        }
        return () => clearInterval(timerRef.current);
      }, [isTimerRunning]);

      const formatTimer = (sec) => {
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      };

      const handleSubmitManual = (e) => {
        e.preventDefault();
        if (!title.trim() || durationMinutes <= 0) return;

        onAddRecord({
          id: Date.now().toString(),
          date: getTodayString(),
          subject: selectedSubject,
          durationMinutes: Number(durationMinutes),
          title: title.trim(),
          memo: memo.trim()
        });

        setTitle('');
        setMemo('');
      };

      const handleSaveTimerRecord = () => {
        const mins = Math.max(1, Math.round(timerSeconds / 60));
        if (!title.trim()) return;

        onAddRecord({
          id: Date.now().toString(),
          date: getTodayString(),
          subject: selectedSubject,
          durationMinutes: mins,
          title: title.trim(),
          memo: memo.trim()
        });

        setIsTimerRunning(false);
        setTimerSeconds(0);
        setTitle('');
        setMemo('');
      };

      return (
        <div className="space-y-6">
          <div className="bg-white border border-slate-100 rounded-2xl p-6 shadow-sm">
            <div className="flex items-center justify-between mb-6">
              <h2 className="text-base font-bold text-slate-800">勉強を記録する</h2>
              
              <div className="bg-slate-100 p-1 rounded-xl flex space-x-1">
                <button
                  type="button"
                  onClick={() => setInputMode('manual')}
                  className={`px-3 py-1.5 text-xs font-semibold rounded-lg transition ${
                    inputMode === 'manual' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500'
                  }`}
                >
                  手動入力
                </button>
                <button
                  type="button"
                  onClick={() => setInputMode('timer')}
                  className={`px-3 py-1.5 text-xs font-semibold rounded-lg transition ${
                    inputMode === 'timer' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500'
                  }`}
                >
                  タイマー
                </button>
              </div>
            </div>

            <div className="mb-5">
              <label className="block text-xs font-bold text-slate-500 mb-2">科目を選択</label>
              <div className="grid grid-cols-3 sm:grid-cols-6 gap-2">
                {SUBJECTS.map((sub) => {
                  const isSelected = selectedSubject === sub.id;
                  return (
                    <button
                      key={sub.id}
                      type="button"
                      onClick={() => setSelectedSubject(sub.id)}
                      className={`py-2 px-3 rounded-xl border text-xs font-bold transition flex items-center justify-center space-x-1 ${
                        isSelected
                          ? `${sub.bg} ${sub.text} ${sub.border} ring-2 ring-blue-400/20`
                          : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'
                      }`}
                    >
                      <span>{sub.name}</span>
                    </button>
                  );
                })}
              </div>
            </div>

            {inputMode === 'timer' ? (
              <div className="space-y-5 bg-slate-50 p-5 rounded-2xl border border-slate-100 text-center">
                <div className="text-5xl font-extrabold tracking-tight text-slate-800 my-2 font-mono">
                  {formatTimer(timerSeconds)}
                </div>
                
                <div className="flex justify-center space-x-3">
                  {!isTimerRunning ? (
                    <button
                      type="button"
                      onClick={() => setIsTimerRunning(true)}
                      className="flex items-center space-x-2 bg-emerald-500 hover:bg-emerald-600 text-white font-bold px-6 py-2.5 rounded-xl transition shadow-sm text-sm"
                    >
                      <Icons.Play />
                      <span>スタート</span>
                    </button>
                  ) : (
                    <button
                      type="button"
                      onClick={() => setIsTimerRunning(false)}
                      className="flex items-center space-x-2 bg-amber-500 hover:bg-amber-600 text-white font-bold px-6 py-2.5 rounded-xl transition shadow-sm text-sm"
                    >
                      <Icons.Pause />
                      <span>一時停止</span>
                    </button>
                  )}
                  <button
                    type="button"
                    onClick={() => { setIsTimerRunning(false); setTimerSeconds(0); }}
                    className="p-2.5 bg-white border border-slate-200 text-slate-600 rounded-xl hover:bg-slate-100 transition"
                  >
                    <Icons.RotateCcw />
                  </button>
                </div>

                <div className="text-left space-y-3 pt-3 border-t border-slate-200">
                  <div>
                    <label className="block text-xs font-bold text-slate-500 mb-1">何をやったか <span className="text-rose-500">*</span></label>
                    <input
                      type="text"
                      value={title}
                      onChange={(e) => setTitle(e.target.value)}
                      placeholder="例: 青チャート P.50〜P.55"
                      className="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-500 mb-1">メモ (任意)</label>
                    <input
                      type="text"
                      value={memo}
                      onChange={(e) => setMemo(e.target.value)}
                      placeholder="例: 間違えた問題にチェックを入れた"
                      className="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500"
                    />
                  </div>
                  <button
                    type="button"
                    disabled={!title.trim() || timerSeconds < 10}
                    onClick={handleSaveTimerRecord}
                    className="w-full mt-2 bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 text-white font-bold py-2.5 rounded-xl transition shadow-sm text-sm"
                  >
                    タイマー記録を保存する
                  </button>
                </div>
              </div>
            ) : (
              <form onSubmit={handleSubmitManual} className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-slate-500 mb-1">勉強時間 (分) <span className="text-rose-500">*</span></label>
                  <input
                    type="number"
                    min="1"
                    max="1440"
                    value={durationMinutes}
                    onChange={(e) => setDurationMinutes(e.target.value)}
                    className="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-500 mb-1">何をやったか <span className="text-rose-500">*</span></label>
                  <input
                    type="text"
                    value={title}
                    onChange={(e) => setTitle(e.target.value)}
                    placeholder="例: システム英単語 1-200"
                    className="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500"
                  />
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-500 mb-1">メモ (任意)</label>
                  <input
                    type="text"
                    value={memo}
                    onChange={(e) => setMemo(e.target.value)}
                    placeholder="例: 苦手な構文をノートに整理"
                    className="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500"
                  />
                </div>

                <button
                  type="submit"
                  disabled={!title.trim() || !durationMinutes}
                  className="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300 text-white font-bold py-3 rounded-xl transition shadow-sm text-sm"
                >
                  記録を追加する
                </button>
              </form>
            )}
          </div>

          <div className="bg-white border border-slate-100 rounded-2xl p-6 shadow-sm">
            <h2 className="text-base font-bold text-slate-800 mb-4">勉強記録の履歴</h2>
            {records.length === 0 ? (
              <p className="text-slate-400 text-xs text-center py-6">まだ記録がありません</p>
            ) : (
              <div className="space-y-3">
                {records.map((r) => {
                  const subObj = SUBJECTS.find(s => s.id === r.subject) || SUBJECTS[5];
                  return (
                    <div key={r.id} className="p-4 rounded-xl border border-slate-100 hover:border-slate-200 transition flex items-center justify-between">
                      <div className="space-y-1">
                        <div className="flex items-center space-x-2">
                          <span className="text-xs font-medium text-slate-400">{formatDate(r.date)}</span>
                          <span className={`text-[11px] font-bold px-2 py-0.5 rounded-md ${subObj.bg} ${subObj.text} border ${subObj.border}`}>
                            {subObj.name}
                          </span>
                        </div>
                        <h3 className="text-sm font-bold text-slate-800">{r.title}</h3>
                        {r.memo && <p className="text-xs text-slate-500">{r.memo}</p>}
                      </div>

                      <div className="flex items-center space-x-3">
                        <span className="text-sm font-bold text-slate-700">{r.durationMinutes} 分</span>
                        <button
                          onClick={() => onDeleteRecord(r.id)}
                          className="text-slate-300 hover:text-rose-500 transition p-1"
                          title="削除"
                        >
                          <Icons.Trash2 />
                        </button>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      );
    }

    // ==========================================
    // 3. ワーク管理画面 (WorkbookView)
    // ==========================================
    function WorkbookView({ workbooks, onAddWorkbook, onUpdatePage }) {
      const [filter, setFilter] = useState('in_progress');
      const [showAddModal, setShowAddModal] = useState(false);

      const [subject, setSubject] = useState('math');
      const [name, setName] = useState('');
      const [totalPages, setTotalPages] = useState('');
      const [currentPage, setCurrentPage] = useState('0');

      const filteredWorkbooks = workbooks.filter(w => 
        filter === 'completed' ? w.isCompleted : !w.isCompleted
      );

      const handleAddSubmit = (e) => {
        e.preventDefault();
        if (!name.trim() || !totalPages) return;

        const total = parseInt(totalPages);
        const curr = parseInt(currentPage) || 0;

        onAddWorkbook({
          id: Date.now().toString(),
          subject,
          name: name.trim(),
          totalPages: total,
          currentPage: curr,
          isCompleted: curr >= total
        });

        setName('');
        setTotalPages('');
        setCurrentPage('0');
        setShowAddModal(false);
      };

      return (
        <div className="space-y-6">
          <div className="flex items-center justify-between">
            <div className="flex space-x-2 bg-slate-100 p-1 rounded-xl">
              <button
                onClick={() => setFilter('in_progress')}
                className={`px-4 py-1.5 text-xs font-bold rounded-lg transition ${
                  filter === 'in_progress' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500'
                }`}
              >
                進行中 ({workbooks.filter(w => !w.isCompleted).length})
              </button>
              <button
                onClick={() => setFilter('completed')}
                className={`px-4 py-1.5 text-xs font-bold rounded-lg transition ${
                  filter === 'completed' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500'
                }`}
              >
                完了済 ({workbooks.filter(w => w.isCompleted).length})
              </button>
            </div>

            <button
              onClick={() => setShowAddModal(true)}
              className="flex items-center space-x-1 bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-2 rounded-xl text-xs transition shadow-sm"
            >
              <Icons.Plus />
              <span>ワークを追加</span>
            </button>
          </div>

          {filteredWorkbooks.length === 0 ? (
            <div className="bg-white border border-slate-100 rounded-2xl p-8 text-center text-slate-400 text-sm">
              {filter === 'completed' ? '完了したワークはありません' : '登録されたワークはありません。「ワークを追加」から登録してください。'}
            </div>
          ) : (
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              {filteredWorkbooks.map((w) => {
                const subObj = SUBJECTS.find(s => s.id === w.subject) || SUBJECTS[5];
                const percent = Math.min(100, Math.round((w.currentPage / w.totalPages) * 100));

                return (
                  <div key={w.id} className="bg-white border border-slate-100 rounded-2xl p-5 shadow-sm space-y-4 flex flex-col justify-between">
                    <div>
                      <div className="flex items-center justify-between mb-2">
                        <span className={`text-[11px] font-bold px-2.5 py-0.5 rounded-md ${subObj.bg} ${subObj.text} border ${subObj.border}`}>
                          {subObj.name}
                        </span>
                        <span className="text-xs font-bold text-slate-500">{percent}% 完了</span>
                      </div>
                      <h3 className="text-base font-bold text-slate-800 line-clamp-1">{w.name}</h3>
                    </div>

                    <div className="space-y-1.5">
                      <div className="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden">
                        <div
                          className={`h-full transition-all duration-300 rounded-full ${
                            w.isCompleted ? 'bg-emerald-500' : 'bg-blue-500'
                          }`}
                          style={{ width: `${percent}%` }}
                        ></div>
                      </div>
                      <div className="flex justify-between items-center text-xs text-slate-500">
                        <span>進捗: {w.currentPage} / {w.totalPages} ページ</span>
                      </div>
                    </div>

                    {!w.isCompleted && (
                      <div className="pt-2 border-t border-slate-100 flex items-center justify-between space-x-2">
                        <div className="flex items-center space-x-1">
                          <button
                            onClick={() => onUpdatePage(w.id, w.currentPage - 1)}
                            className="px-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg text-xs font-bold transition"
                          >
                            -1
                          </button>
                          <button
                            onClick={() => onUpdatePage(w.id, w.currentPage + 1)}
                            className="px-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg text-xs font-bold transition"
                          >
                            +1
                          </button>
                          <button
                            onClick={() => onUpdatePage(w.id, w.currentPage + 5)}
                            className="px-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg text-xs font-bold transition"
                          >
                            +5
                          </button>
                        </div>

                        <input
                          type="number"
                          value={w.currentPage}
                          onChange={(e) => onUpdatePage(w.id, parseInt(e.target.value) || 0)}
                          className="w-16 bg-slate-50 border border-slate-200 rounded-lg px-2 py-1 text-xs text-right font-bold focus:outline-none focus:ring-1 focus:ring-blue-500"
                        />
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}

          {showAddModal && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white border border-slate-100 rounded-2xl p-6 shadow-xl w-full max-w-md space-y-4">
                <h3 className="text-base font-bold text-slate-800">新しいワークを登録</h3>

                <form onSubmit={handleAddSubmit} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-500 mb-1">科目</label>
                    <select
                      value={subject}
                      onChange={(e) => setSubject(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-blue-500/20"
                    >
                      {SUBJECTS.map(s => (
                        <option key={s.id} value={s.id}>{s.name}</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-500 mb-1">ワーク・参考書名 <span className="text-rose-500">*</span></label>
                    <input
                      type="text"
                      required
                      placeholder="例: フォーカスゴールド 数学IA"
                      value={name}
                      onChange={(e) => setName(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-slate-500 mb-1">総ページ数 <span className="text-rose-500">*</span></label>
                      <input
                        type="number"
                        required
                        min="1"
                        placeholder="例: 300"
                        value={totalPages}
                        onChange={(e) => setTotalPages(e.target.value)}
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-500 mb-1">現在のページ</label>
                      <input
                        type="number"
                        min="0"
                        value={currentPage}
                        onChange={(e) => setCurrentPage(e.target.value)}
                        className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20"
                      />
                    </div>
                  </div>

                  <div className="flex justify-end space-x-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setShowAddModal(false)}
                      className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-xs font-bold transition"
                    >
                      キャンセル
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold transition shadow-sm"
                    >
                      登録する
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 4. データ画面 (AnalyticsView)
    // ==========================================
    function AnalyticsView({ records }) {
      const past7DaysData = Array.from({ length: 7 }, (_, i) => {
        const d = new Date();
        d.setDate(d.getDate() - (6 - i));
        const dateStr = d.toISOString().split('T')[0];
        const dayLabel = `${d.getMonth() + 1}/${d.getDate()}`;
        const totalMinutes = records
          .filter(r => r.date === dateStr)
          .reduce((acc, r) => acc + r.durationMinutes, 0);
        return { dateStr, dayLabel, minutes: totalMinutes, hours: (totalMinutes / 60).toFixed(1) };
      });

      const weeklyTotalMinutes = past7DaysData.reduce((acc, d) => acc + d.minutes, 0);
      const weeklyTotalHours = (weeklyTotalMinutes / 60).toFixed(1);
      const weeklyAvgHours = (weeklyTotalMinutes / 7 / 60).toFixed(1);

      const subjectStats = SUBJECTS.map(sub => {
        const minutes = records
          .filter(r => r.subject === sub.id)
          .reduce((acc, r) => acc + r.durationMinutes, 0);
        return { ...sub, minutes, hours: (minutes / 60).toFixed(1) };
      }).filter(s => s.minutes > 0);

      const allTotalMinutes = records.reduce((acc, r) => acc + r.durationMinutes, 0);
      const maxDailyHours = Math.max(...past7DaysData.map(d => parseFloat(d.hours)), 1);

      return (
        <div className="space-y-6">
          <div className="grid grid-cols-2 gap-4">
            <div className="bg-white border border-slate-100 rounded-2xl p-5 shadow-sm">
              <span className="text-xs font-bold text-slate-400">週間勉強時間</span>
              <div className="mt-2 flex items-baseline space-x-1">
                <span className="text-3xl font-extrabold text-slate-800">{weeklyTotalHours}</span>
                <span className="text-xs text-slate-500 font-semibold">時間</span>
              </div>
            </div>
            <div className="bg-white border border-slate-100 rounded-2xl p-5 shadow-sm">
              <span className="text-xs font-bold text-slate-400">1日平均時間</span>
              <div className="mt-2 flex items-baseline space-x-1">
                <span className="text-3xl font-extrabold text-emerald-600">{weeklyAvgHours}</span>
                <span className="text-xs text-slate-500 font-semibold">時間/日</span>
              </div>
            </div>
          </div>

          <div className="bg-white border border-slate-100 rounded-2xl p-6 shadow-sm">
            <h2 className="text-sm font-bold text-slate-700 mb-6">日別勉強時間 (過去7日間)</h2>
            <div className="flex items-end justify-between h-44 pt-4 px-2">
              {past7DaysData.map((day, idx) => {
                const heightPercent = Math.min(100, (parseFloat(day.hours) / maxDailyHours) * 100);
                return (
                  <div key={idx} className="flex flex-col items-center flex-1 space-y-2">
                    <span className="text-[11px] text-slate-400 font-bold">{day.hours}h</span>
                    <div className="w-full max-w-[32px] bg-slate-100 h-28 rounded-t-lg flex items-end overflow-hidden">
                      <div
                        className="w-full bg-blue-500 rounded-t-lg transition-all duration-500"
                        style={{ height: `${heightPercent}%` }}
                      ></div>
                    </div>
                    <span className="text-xs font-medium text-slate-500">{day.dayLabel}</span>
                  </div>
                );
              })}
            </div>
          </div>

          <div className="bg-white border border-slate-100 rounded-2xl p-6 shadow-sm space-y-4">
            <h2 className="text-sm font-bold text-slate-700">科目別勉強割合</h2>

            {allTotalMinutes > 0 ? (
              <>
                <div className="w-full h-4 bg-slate-100 rounded-full overflow-hidden flex">
                  {subjectStats.map((sub) => {
                    const percent = (sub.minutes / allTotalMinutes) * 100;
                    return (
                      <div
                        key={sub.id}
                        style={{ width: `${percent}%`, backgroundColor: sub.badgeColor }}
                        className="h-full transition-all duration-300"
                        title={`${sub.name}: ${percent.toFixed(1)}%`}
                      ></div>
                    );
                  })}
                </div>

                <div className="space-y-3 pt-2">
                  {subjectStats.map((sub) => {
                    const percent = ((sub.minutes / allTotalMinutes) * 100).toFixed(1);
                    return (
                      <div key={sub.id} className="flex items-center justify-between text-xs">
                        <div className="flex items-center space-x-2">
                          <span className="w-3 h-3 rounded-full" style={{ backgroundColor: sub.badgeColor }}></span>
                          <span className="font-bold text-slate-700">{sub.name}</span>
                        </div>
                        <div className="flex items-center space-x-3">
                          <span className="text-slate-400">{percent}%</span>
                          <span className="font-bold text-slate-800">{sub.hours} 時間</span>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </>
            ) : (
              <p className="text-xs text-slate-400 text-center py-4">データが蓄積されると科目別の割合グラフが表示されます</p>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
